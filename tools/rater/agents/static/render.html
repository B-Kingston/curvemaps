<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/maplibre-gl.css">
<script src="/maplibre-gl.js"></script><script src="/pmtiles.js"></script>
<style>html,body{margin:0;height:100%}#map{position:absolute;inset:0}
#legend{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.93);font:15px/1.3 sans-serif;padding:6px 9px;border:1px solid #333;max-width:62%;z-index:5}
#legend .sw{display:inline-block;width:22px;height:6px;margin-right:6px;vertical-align:middle}</style></head>
<body><div id="map"></div><div id="legend"></div>
<script>
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);
const map = new maplibregl.Map({ container: "map", style: "/style.json", center: [153, -27], zoom: 9,
  canvasContextAttributes: { preserveDrawingBuffer: true }, attributionControl: false, fadeDuration: 0 });
map.addControl(new maplibregl.ScaleControl({ maxWidth: 200, unit: "metric" }), "bottom-left");
window.ready = new Promise(r => map.on("load", r));
const LAYERS = ["r-casing", "r-line", "r-dash", "ticks-c", "ticks-t", "mk-c", "mk-t"];
window.render = async (spec) => {
  await window.ready;
  for (const id of LAYERS) if (map.getLayer(id)) map.removeLayer(id);
  for (const id of ["routes", "ticks", "markers"]) if (map.getSource(id)) map.removeSource(id);
  map.addSource("routes", { type: "geojson", data: { type: "FeatureCollection", features: spec.routes.map((r, i) => ({
    type: "Feature", properties: { color: r.color, width: r.width, opacity: r.opacity ?? 1, casing: r.casing ? 1 : 0, dash: r.dash ? 1 : 0, z: i },
    geometry: { type: "LineString", coordinates: r.coords.map(([lat, lon]) => [lon, lat]) } })) } });
  map.addLayer({ id: "r-casing", type: "line", source: "routes", filter: ["==", ["get", "casing"], 1],
    layout: { "line-cap": "round", "line-join": "round", "line-sort-key": ["get", "z"] },
    paint: { "line-color": "#fff", "line-width": ["+", ["get", "width"], 4] } });
  map.addLayer({ id: "r-dash", type: "line", source: "routes", filter: ["==", ["get", "dash"], 1],
    layout: { "line-cap": "butt", "line-join": "round" },
    paint: { "line-color": ["get", "color"], "line-width": ["get", "width"], "line-opacity": ["get", "opacity"], "line-dasharray": [2, 1.2] } });
  map.addLayer({ id: "r-line", type: "line", source: "routes", filter: ["==", ["get", "dash"], 0],
    layout: { "line-cap": "round", "line-join": "round", "line-sort-key": ["get", "z"] },
    paint: { "line-color": ["get", "color"], "line-width": ["get", "width"], "line-opacity": ["get", "opacity"] } });
  map.addSource("ticks", { type: "geojson", data: { type: "FeatureCollection", features: (spec.ticks || []).map(t => ({
    type: "Feature", properties: { label: t.label }, geometry: { type: "Point", coordinates: [t.lon, t.lat] } })) } });
  map.addLayer({ id: "ticks-c", type: "circle", source: "ticks", paint: { "circle-radius": 4, "circle-color": "#000", "circle-stroke-color": "#fff", "circle-stroke-width": 1.5 } });
  map.addLayer({ id: "ticks-t", type: "symbol", source: "ticks", layout: { "text-field": ["get", "label"], "text-font": ["Noto Sans Bold"], "text-size": 13,
    "text-offset": [0, -1.1], "text-allow-overlap": true }, paint: { "text-color": "#000", "text-halo-color": "#ff0", "text-halo-width": 2 } });
  map.addSource("markers", { type: "geojson", data: { type: "FeatureCollection", features: (spec.markers || []).map(m => ({
    type: "Feature", properties: { label: m.label, color: m.color }, geometry: { type: "Point", coordinates: [m.lon, m.lat] } })) } });
  map.addLayer({ id: "mk-c", type: "circle", source: "markers", paint: { "circle-radius": 9, "circle-color": ["get", "color"], "circle-stroke-color": "#000", "circle-stroke-width": 2 } });
  map.addLayer({ id: "mk-t", type: "symbol", source: "markers", layout: { "text-field": ["get", "label"], "text-font": ["Noto Sans Bold"], "text-size": 13, "text-allow-overlap": true },
    paint: { "text-color": "#fff", "text-halo-color": "#000", "text-halo-width": 1 } });
  document.getElementById("legend").innerHTML = spec.legend || "";
  const b = spec.bounds;
  map.fitBounds([[b[1], b[0]], [b[3], b[2]]], { padding: { top: spec.padTop ?? 120, bottom: 50, left: 50, right: 50 }, duration: 0, maxZoom: spec.maxZoom ?? 16.5 });
  await new Promise(r => { map.once("idle", r); map.triggerRepaint(); });
  return map.getZoom();
};
</script></body></html>
